name: padong test
on:
  push:
    paths:
      - 'padong/**'
  pull_request:
    paths:
      - 'padong/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: syntax check
        shell: bash
        run: |
          shopt -s nullglob
          for f in padong/*.mjs padong/tests/*.mjs; do
            node --check "$f"
          done
      - name: integration test
        run: node padong/tests/test-padong.mjs
