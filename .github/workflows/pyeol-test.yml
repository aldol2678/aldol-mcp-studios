name: pyeol test
on:
  push:
    paths:
      - 'pyeol/**'
  pull_request:
    paths:
      - 'pyeol/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: syntax check
        run: for f in pyeol/*.mjs pyeol/tests/*.mjs; do node --check "$f"; done
      - name: integration test
        run: node pyeol/tests/test-pyeol.mjs
